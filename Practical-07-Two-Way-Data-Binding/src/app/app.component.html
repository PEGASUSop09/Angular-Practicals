<div class="container">
  <div class="card">
    <div class="badge">Practical 07</div>
    <h2>{{ title }}</h2>
    <hr />

    <div class="form-group">
      <label for="firstName">Enter First Name:</label>
      <input
        type="text"
        id="firstName"
        [(ngModel)]="name"
        placeholder="Type your first name..."
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label for="lastName">Enter Last Name:</label>
      <input
        type="text"
        id="lastName"
        [(ngModel)]="surname"
        placeholder="Type your last name..."
        class="form-control"
      />
    </div>

    <div class="live-preview-box">
      <span class="preview-tag">Live Two-Way Preview</span>
      <h3>Hello, <span class="highlight">{{ name }} {{ surname }}</span> 👋</h3>
      <p>Any keystroke above immediately synchronizes with the component property!</p>
    </div>
  </div>
</div>
